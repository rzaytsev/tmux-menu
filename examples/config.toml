# Web browser application; empty uses the system default. Workspace overrides home.
browser = ""

[palette]
# Available sections: "agents", "sessions", "panes".
sections = ["sessions", "panes"]

[picker]
# Show optional view-specific helper text.
show_help = false
# Width of right-side previews in picker views.
preview_width = "60%"
# View order for Tab and Shift-Tab navigation.
tab_order = ["palette", "agents", "tools", "projects", "status", "bookmarks", "docs"]

[session]
# Auto chooses a stable color per session name; explicit colors override it.
# All supported session-name colors:
# auto, default, black, red, green, yellow, blue, magenta, cyan, white, orange,
# bright_black, bright_red, bright_green, bright_yellow, bright_blue,
# bright_magenta, bright_cyan, bright_white.
color = "auto"

[agents]
# Dedicated agents popup width; other views use popup.width.
popup_width = "100%"

[agents.icons]
# Empty other uses the detected product name.
codex = ">"
claude = "✳"
other = ""
current = "*"
branch = "├─"
last_branch = "└─"
attention = "!"
working = "●"
completed = "✓"
waiting = "○"
unknown = "?"

[agents.colors]
# Supports explicit session colors listed above plus dim (not auto).
codex = "blue"
claude = "orange"
other = "magenta"
branch = "dim"
thread = "default"
workdir = "dim"
attention = "red"
working = "green"
completed = "bright_cyan"
waiting = "yellow"
unknown = "dim"

[projects]
# Root directories scanned by the projects view.
roots = ["~/projects"]
# File that marks a project as having native tmux bootstrap.
bootstrap_file = ".tmux-sessionizer"

[[commands]]
title = "Lazygit"
category = "Tools"
mode = "popup"
cmd = "lazygit"

[[commands]]
title = "Tig"
category = "Tools"
mode = "popup"
cmd = "tig"

[[commands]]
title = "Git status"
category = "Git"
mode = "paste"
cmd = "git status"
# Optional: only show this command in a matching tmux session.
# session = "tmux-menu"
enter = true

[[commands]]
title = "Git diff"
category = "Git"
mode = "paste"
cmd = "git diff"
# session = "tmux-menu"
enter = true

[[quick_dirs]]
title = "documents"
path = "~/Documents"
# Optional: run after changing into the directory.
# command = "git status"

[[quick_dirs]]
title = "config"
path = "~/.config"

[[quick_dirs]]
title = "projects"
path = "~/projects"

[popup]
width = "90%"
height = "80%"
border = "rounded"

[editor]
command = "$EDITOR"

[editor.popup]
width = "80%"
height = "80%"
border = "rounded"

[links]
# URL schemes extracted from pane scrollback. Local config replaces this list.
url_schemes = ["http", "https", "slack", "tg"]
# Optional Jira root for issue keys such as INF-234. Prefer a local config.
jira_base_url = ""

[links.alternate]
# Secondary opener used by Alt-Enter in the links view.
# Use {} when the target must appear before later command arguments.
key = "alt-enter"
file_command = "open -a TextEdit"
url_command = "open -a Safari"

[links.open]
# Legacy links.open: accepted for compatibility. Typed files use a Neovim pane.
mode = "popup"
# Used when mode = "pane": right, left, above, or below.
pane_side = "right"

[bookmarks]
# Markdown directories scanned by the bookmarks view, in display order.
# {project} expands to the current tmux project/session name.
# Omit dirs to scan the session workspace (~/notes without a workspace).
# dirs = [] disables scanning; workspace lists replace home lists.
# Relative paths start at the directory containing this config.
# dirs = ["notes/bookmarks"]
ignore_patterns = [".git", ".tmp", "vendor", "node_modules", ".venv"]

[bookmarks.open]
# Legacy bookmarks.open: accepted for compatibility. Typed files use a Neovim pane.
mode = "pane"
pane_side = "right"

[docs]
# Markdown documents; relative paths resolve from the tmux session root.
# {project} expands to the current project name.
dirs = ["~/notes/projects/{project}", "."]
ignore_patterns = [".git", ".tmp", "vendor", "node_modules", ".venv"]
preview_command = "glow"

[docs.open]
mode = "pane"
pane_side = "right"

[status]
# Optional command replacing the directory-based status picker for this config.
# command = 'python3 "$TMUX_MENU_SESSION_PATH/scripts/todo.py"'
# Reporter timeout for each configured cross-project radar target.
report_timeout = "3s"
# Relative paths resolve from the current tmux session root.
status_dir = ["./todo"]
# Status subdirectories shown under each status_dir, in display order.
statuses = ["new", "doing", "done"]
preview_command = "glow"
ignore_patterns = [".gitkeep"]

# Add one reporter per active tmux session to enable the radar view:
# [[status.targets]]
# title = "Example"
# session = "example"
# command = "./scripts/status-report"

[status.open]
# Opener for selected status files: popup, pane, or window.
mode = "pane"
pane_side = "below"
